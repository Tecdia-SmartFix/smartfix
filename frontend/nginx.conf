# Nginx config for the SmartFix frontend container.
# Mirrors the Vite dev-server proxy in vite.config.js so production behaves
# the same as `npm run dev` — same paths reach the backend, same SPA fallback.

upstream smartfix_backend {
    # Resolved via Docker's embedded DNS to the `backend` service in
    # docker-compose.yml. Keep `backend:8000` in sync with the service name.
    server backend:8000;
}

server {
    listen       80;
    server_name  _;

    # Reasonable defaults for the kinds of payloads we send:
    # PDF uploads (up to 50 MB per backend limit) need this bumped.
    client_max_body_size 60M;

    # ── API reverse-proxy ────────────────────────────────────────────────
    # Match the exact prefixes that vite.config.js proxies. Any backend route
    # added in api.py needs a corresponding location block here AND a proxy
    # entry in vite.config.js (or it breaks in dev + prod respectively).
    location ~ ^/(auth|admin|machines|shifts|query|health|workstation)(/|$) {
        proxy_pass         http://smartfix_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── SPA static + fallback ────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted Vite asset bundles (filename-hashed).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
